[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "wrath"
version = "1.0"
authors = [{name = "Anna Orteu"}]
description = "Script to detect SVs from haplotagging data"
requires-python = ">=3.11"
readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-or-later"
dependencies = [
  'click',
  'pysam',
  'numpy',
  'polars',
  'seaborn',
  'matplotlib',
  'scikit-learn'
]

[project.scripts]
wrath = "wrath.__main__:cli"

[tool.setuptools]
packages = ["wrath"]

[tool.pixi.workspace]
authors = ["pdimens <pdimens@gmail.com>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
wrath = { path = ".", editable = true }

[tool.pixi.dependencies]
pysam = ">=0.24.0,<0.25"
numpy = ">=2.5.1,<3"
polars = ">=1.43.2,<2"
seaborn = ">=0.13.2,<0.14"
matplotlib = ">=3.11.1,<4"
scikit-learn = ">=1.9.0,<2"
click = ">=8.4.2,<9"
